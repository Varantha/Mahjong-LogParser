# The drill catalogue: the drills the trainer bundle holds (see docs/adr/0001).
#
# Export builds each drill by searching the whole hand store, newest year of logs
# first. A drill short of hands draws on older years; if every year together is
# still short, export says by how much. A drill is never shrunk to fit.
#
# Each drill has:
#   key     stable string key; the trainer translates it into a display name
#   target  how many hands the drill aims for
#   pool    the hands it may take, as conditions on plain values and tags (below).
#           Without a pool it may take any verified hand, drawn at random, so each
#           kind of hand turns up at its real-game frequency.
#
# A condition names a plain value (han, fu, rawFu, limitTier, dealer, tsumo, open,
# yaku, doraCount, honba, riichiSticks, callTypes) or `tags`, and gives one value or
# a list of them. A hand meets it when its value is one of them; for yaku, callTypes
# and tags, when it holds any of them. A hand must meet every condition.
#
#   pool = { tsumo = true, dealer = true }
#   pool = { limitTier = ["sanbaiman", "yakuman"] }
#   pool = { tags = "kuisagari" }
#
# A drill may also mix its pool in one of two ways:
#   trap        conditions for the pool hands with the trap. A share of the drill
#   lookalikes  goes to lookalikes, pool hands without the trap, so the drill doesn't
#               give the answer away: 0.5 (about half) unless `lookalikes` says
#               otherwise.
#   quotas      a list of { share = ..., where = { conditions } }: each keeps its share
#               of the drill for the pool hands that also meet `where`, so they turn up
#               more often than in real games. The rest is drawn from the whole pool.
# Each share (the trap hands, the lookalikes, each quota and the rest) draws on older
# years on its own, and is not made up from another share when it falls short.

[[drill]]
key = "everything"
target = 500
